name: Source and artwork checks
on:
  push:
    branches: [japan-rising]
  pull_request:
    branches: [japan-rising]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_source_release.py
